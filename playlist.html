<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Playlist | DX</title>

<link rel="stylesheet" href="playlist.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="background-glow"></div>

<nav>

    <a href="dashboard.html" class="back-btn">
        ← Back
    </a>

    <div id="clock">00:00:00</div>

</nav>

<main>

    <section class="hero">

        <span>PLAYLIST</span>

        <h1>
            Currently on repeat...
        </h1>

        <p>
            Soundtracks for different moods,
            memories, and moments.
        </p>

    </section>

    <section class="playlist-archive">

        <!-- PLAYLIST 1 -->

        <div class="playlist-card">

            <div class="playlist-info">

                <div class="number">
                    001
                </div>

                <h2>
                    Swiftie Therapy Session
                </h2>

                <p>
                    For healing, reminiscing,
                    and feeling everything at once.
                </p>

            </div>

            <iframe
                src="https://open.spotify.com/embed/playlist/6EqW1oCx94XPa1n6LWApYH"
                width="100%"
                height="352"
                frameborder="0"
                allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>

        </div>

        <!-- PLAYLIST 2 -->

        <div class="playlist-card">

            <div class="playlist-info">

                <div class="number">
                    002
                </div>

                <h2>
                    Vroom!!!
                </h2>

                <p>
                    Fast lanes,
                    night drives,
                    and main-character energy.
                </p>

            </div>

            <iframe
                src="https://open.spotify.com/embed/playlist/2G9RJ4uNtU0POG49XOPJSm"
                width="100%"
                height="352"
                frameborder="0"
                allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>

        </div>

    </section>

</main>

<script src="playlist.js"></script>

</body>
</html>
