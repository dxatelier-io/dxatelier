<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DX Dashboard</title>

<link rel="stylesheet" href="dashboard.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background-glow"></div>

<header>

    <div class="brand">

        <img src="dxlogo.png" alt="DX">

        <div>
            <h1>DX</h1>
            <p>Code • Write • Speak</p>
        </div>

    </div>

    <div class="clock-box">

        <div id="clock">00:00:00</div>
        <div id="date">Loading...</div>

    </div>

</header>

<main>

    <section class="hero">

        <h2 id="greeting">Good Evening</h2>

        <p>
            Welcome back to your digital space.
        </p>

    </section>

    <section class="grid">

        <a href="about.html" class="card">
            <span>01</span>
            <h3>About</h3>
            <p>Who I am</p>
        </a>

        <a href="writings.html" class="card">
            <span>02</span>
            <h3>Writings</h3>
            <p>Stories & thoughts</p>
        </a>

        <a href="gallery.html" class="card">
            <span>03</span>
            <h3>Gallery</h3>
            <p>Moments & memories</p>
        </a>

        <a href="playlist.html" class="card">
            <span>04</span>
            <h3>Playlist</h3>
            <p>Music collection</p>
        </a>

        <a href="findme.html" class="card">
            <span>05</span>
            <h3>Contact</h3>
            <p>Business inquiries</p>
        </a>

    </section>

</main>

<script src="dashboard.js"></script>

</body>
</html>
