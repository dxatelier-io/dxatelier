<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      font-family: 'Baloo 2', cursive;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .box {
      border: 2px dashed #000;
      padding: 30px;
      border-radius: 20px;
      transform: rotate(-1deg);
      max-width: 400px;
    }

    .box:hover {
      transform: rotate(0deg) scale(1.03);
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    p {
      margin-top: 15px;
      line-height: 1.6;
      opacity: 0.8;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 14px;
      background: #000;
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
    }

    .btn:hover {
      background: #f9a8d4;
      color: #000;
    }

    .doodle {
      position: absolute;
      font-family: 'Kalam', cursive;
      font-size: 14px;
      opacity: 0.6;
    }

    .d1 { top: 20px; left: 20px; }
    .d2 { bottom: 20px; right: 20px; }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      opacity: 0.6;
    }

  </style>
</head>
